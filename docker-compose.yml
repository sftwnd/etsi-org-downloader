services:

  etsiorg:
    container_name: "etsiorg-downloader"
    build:
      context: ./
    image: sftwnd/etsi-org:1.0
    hostname: etsiorg-downloader
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      # a run logs a line per file: the log is rotated, at most 5 files of 10 MB
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    volumes:
      - ./deliver:/data/deliver
