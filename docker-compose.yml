services:

  etsiorg:
    container_name: "etsiorg-downloader"
    build:
      context: ./
    image: sftwnd/etsi-org:1.0
    hostname: etsiorg-downloader
    environment:
      # the settings of the downloader, if they are set in the environment of docker compose or in .env
      - ETSIORG_URI
      - ETSIORG_THREADS
      - ETSIORG_ZONE
      - ETSIORG_DRY_RUN
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      # a run logs a line per file: the log is rotated, at most 5 files of 10 MB
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    volumes:
      # the whole destination folder of the image (-Ddest=/data): ./mirror or the host folder ETSIORG_MIRROR names
      - ${ETSIORG_MIRROR:-./mirror}:/data
