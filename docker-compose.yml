services:

  etsiorg:
    container_name: "etsiorg-downloader"
    build:
      context: ./
    # the image of the sources at hand; the downloader logs its version at the start
    image: sftwnd/etsiorg-downloader
    hostname: etsiorg-downloader
    environment:
      # the settings of the downloader, if they are set in the environment of docker compose or in .env
      - ETSIORG_URI
      - ETSIORG_THREADS
      - ETSIORG_ZONE
      - ETSIORG_DRY_RUN
    # a run needs about 1.2 KB of heap per file of the tree: 1 GiB, 75 % of it for the heap, is enough for about
    # 600 000 files; ETSIORG_MEMORY and ETSIORG_CPUS change the limits
    mem_limit: ${ETSIORG_MEMORY:-1g}
    cpus: ${ETSIORG_CPUS:-2}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      # a run logs a line per file: the log is rotated, at most 5 files of 10 MB
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    volumes:
      # the whole destination folder of the image (-Ddest=/data): ./mirror or the host folder ETSIORG_MIRROR names
      - ${ETSIORG_MIRROR:-./mirror}:/data
